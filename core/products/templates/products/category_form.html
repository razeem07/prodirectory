{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="form-container">
    <div class="form-card">
        <h1>{{ title }}</h1>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span class="form-error">{{ field.errors }}</span>
                {% endif %}
            </div>
            {% endfor %}
            <div class="form-buttons">
                <button type="submit" class="btn btn-primary">{{ button }}</button>
                <a href="{% url 'products:category_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
