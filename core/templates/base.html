{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Product Directory{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  
    <nav class="navbar">
    <div class="nav-container">
        <a href="{% url 'products:list' %}" class="nav-brand">📦 Product Directory</a>
        <div class="nav-links">
            <a href="{% url 'products:category_list' %}" class="btn btn-secondary">Categories</a>
            <a href="{% url 'products:add' %}" class="btn btn-primary">+ Add Product</a>
        </div>
    </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Product Directory &copy; 2026</p>
    </footer>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
